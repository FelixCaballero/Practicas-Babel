<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="card">
        <div class="card-header">
          <h4>Modificación de Página</h4>
          <p class="subtitulo">Edita la información de la página del portal</p>
        </div>

        <div class="card-body">
          <div *ngIf="mensajeError" class="mensaje-error">
            {{ mensajeError }}
          </div>

          <form [formGroup]="paginaForm" (ngSubmit)="onSubmit()">
            <div class="row g-4">
              <div class="col-md-6">
                <label class="form-label">Título</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="titulo"
                  placeholder="Ej: Citas médicas">
              </div>

              <div class="col-md-6">
                <label class="form-label">Idioma</label>
                <select
                  class="form-control"
                  formControlName="idLang">
                  <option value="E">Español</option>
                  <option value="I">Inglés</option>
                  <option value="G">Gallego</option>
                  <option value="C">Catalán</option>
                </select>
              </div>

              <div class="col-md-12">
                <label class="form-label">Descripción</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="descripcion"
                  placeholder="Descripción breve">
              </div>

              <div class="col-md-12">
                <label class="form-label">Migas de pan</label>
                <input
                  type="text"
                  class="form-control"
                  formControlName="migasPan"
                  placeholder="Ej: Inicio / Citas">
              </div>

              <div class="col-md-12">
                <label class="form-label">Contenido de la página</label>
                <quill-editor
                  formControlName="pagina"
                  theme="snow">
                </quill-editor>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-3 mt-4">
              <a routerLink="/layout/consultar-pagina" class="btn btn-outline-secondary">
                Cancelar
              </a>

              <button type="submit" class="btn btn-warning">
                Guardar cambios
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
