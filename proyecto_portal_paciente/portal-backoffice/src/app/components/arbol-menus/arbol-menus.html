<div class="container py-4">
  <div class="card form-card">
    <div class="card-body p-4">
      <h2 class="mb-4 text-white">Consulta Guiada de Menús</h2>

      <div *ngIf="cargando" class="estado-box">
        Cargando menús...
      </div>

      <div *ngIf="!cargando && menus.length === 0" class="estado-box">
        No hay menús para mostrar.
      </div>

      <ul class="tree-root" *ngIf="!cargando && menus.length > 0">
        <ng-container *ngTemplateOutlet="treeTemplate; context: { $implicit: menus }"></ng-container>
      </ul>

      <ng-template #treeTemplate let-items>
        <li *ngFor="let menu of items" class="tree-node">
          <div class="node-row">
            <div class="node-info">
              <div class="node-title">{{ menu.nomMenu }}</div>
              <div class="node-meta">
                ID: {{ menu.id }} | Nivel: {{ menu.nivel }} | Href: {{ menu.hrefMenu }}
              </div>
            </div>

            <button
              *ngIf="esHoja(menu)"
              type="button"
              class="btn btn-warning btn-sm"
              (click)="modificar(menu)">
              Modificar
            </button>
          </div>

          <ul *ngIf="menu.children.length > 0" class="tree-children">
            <ng-container *ngTemplateOutlet="treeTemplate; context: { $implicit: menu.children }"></ng-container>
          </ul>
        </li>
      </ng-template>
    </div>
  </div>
</div>
