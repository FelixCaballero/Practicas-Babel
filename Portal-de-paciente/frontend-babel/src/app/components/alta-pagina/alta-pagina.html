<div>
  <h2>Gestión: {{ isEditPagina ? 'Modificar Página' : 'Alta de Página' }}</h2>
  <form [formGroup]="paginaForm" (ngSubmit)="guardarPagina()">
    <div class="form-grid">
      <div style="display:flex; flex-direction:column; gap:4px; width: 100%;">
        <input type="text" formControlName="titulo" placeholder="Título">
        <span *ngIf="paginaForm.get('titulo')?.invalid && (paginaForm.get('titulo')?.dirty || paginaForm.get('titulo')?.touched)" style="color: red; font-size: 0.85em;">El título es obligatorio (mínimo 3 caracteres, máx 120).</span>
      </div>
      <div style="display:flex; flex-direction:column; gap:4px; width: 100%;">
        <input type="text" formControlName="descripcion" placeholder="Descripción">
        <span *ngIf="paginaForm.get('descripcion')?.invalid && (paginaForm.get('descripcion')?.dirty || paginaForm.get('descripcion')?.touched)" style="color: red; font-size: 0.85em;">La descripción es obligatoria.</span>
      </div>
    </div>
    <div class="form-grid">
      <div style="display:flex; flex-direction:column; gap:4px; width: 100%;">
        <select formControlName="idLang" style="padding: 10px; border-radius: 4px; border: 1px solid #ccc; background-color: white; width: 100%;">
          <option value="" disabled selected>Seleccione Idioma</option>
          <option value="1">Inglés (1)</option>
          <option value="2">Catalán (2)</option>
          <option value="3">Valenciano (3)</option>
          <option value="4">Gallego (4)</option>
        </select>
        <span *ngIf="paginaForm.get('idLang')?.invalid && (paginaForm.get('idLang')?.dirty || paginaForm.get('idLang')?.touched)" style="color: red; font-size: 0.85em;">Debes seleccionar un idioma.</span>
      </div>
      <input type="text" formControlName="migasPan" placeholder="Migas de pan (ej: Inicio > Sección)">
    </div>
    <div style="display:flex; flex-direction:column; gap:4px; width: 100%; margin-top: 15px;">
      <quill-editor formControlName="pagina" [modules]="quillModules" theme="snow" placeholder="Escribe el contenido HTML aquí..." style="display: block; min-height: 250px; background: white; margin-bottom: 25px;"></quill-editor>
      <span *ngIf="paginaForm.get('pagina')?.invalid && (paginaForm.get('pagina')?.dirty || paginaForm.get('pagina')?.touched)" style="color: red; font-size: 0.85em;">El contenido es obligatorio.</span>
    </div>
    
    <div style="margin-top: 15px;">
      <button type="submit" class="btn-save" [disabled]="paginaForm.invalid" [style.opacity]="paginaForm.invalid ? '0.5' : '1'">{{ isEditPagina ? 'Actualizar Página' : 'Guardar Página' }}</button>
      <button type="button" class="btn-exit" (click)="cancelar()" style="margin-left: 10px;">Cancelar</button>
    </div>
  </form>
</div>
