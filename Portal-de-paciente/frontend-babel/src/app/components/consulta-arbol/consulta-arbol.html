<div class="admin-card" style="position: relative; padding-bottom: 60px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2 style="margin: 0;">Consulta Árbol</h2>

    <!-- Selector de Idioma -->
    <div>
      <label style="font-weight: 600; margin-right: 8px;">Idioma:</label>
      <select [(ngModel)]="idiomaSeleccionado" (change)="cargarMenus()" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer;">
        <option value="1">EN</option>
        <option value="2">CA</option>
        <option value="3">VA</option>
        <option value="4">GL</option>
      </select>
    </div>
  </div>

  <div class="tree-container">
    <ng-template #nodoTemplate let-nodo>
      <div class="tree-node">
        <div class="tree-node-content" (click)="nodoSeleccionado = nodo" [class.selected]="nodoSeleccionado?.idMenu === nodo.idMenu">
          <span class="tree-bullet">•</span>
          <span class="tree-label">{{ nodo.nomMenu }}</span>
        </div>
        <div *ngIf="nodo.hijos?.length > 0" class="tree-children">
          <ng-container *ngFor="let hijo of nodo.hijos">
            <ng-container *ngTemplateOutlet="nodoTemplate; context: { $implicit: hijo }"></ng-container>
          </ng-container>
        </div>
      </div>
    </ng-template>

    <div *ngIf="arbolCompleto.length === 0">No hay menús registrados para este idioma.</div>
    <ng-container *ngFor="let raiz of arbolCompleto">
      <ng-container *ngTemplateOutlet="nodoTemplate; context: { $implicit: raiz }"></ng-container>
    </ng-container>
  </div>

  <div class="tree-actions-floating">
    <span *ngIf="nodoSeleccionado" style="font-size: 0.9rem; color: #333;">Seleccionado: <strong>{{ nodoSeleccionado.nomMenu }}</strong></span>
    <div>
      <button class="btn-edit" style="margin-right: 10px;" [disabled]="!nodoSeleccionado" (click)="nodoSeleccionado && editarMenu(nodoSeleccionado)">Modificar</button>
      <button class="btn-delete" style="margin-right: 10px;" [disabled]="!nodoSeleccionado" (click)="nodoSeleccionado && borrarMenu(nodoSeleccionado)">Eliminar</button>
      
      <span *ngIf="nodoSeleccionado" style="font-size: 0.9rem; color: #555; margin-left:10px; margin-right:5px;">Traducir: </span>
      <button class="btn-lang" [disabled]="!nodoSeleccionado" (click)="nodoSeleccionado && crearTraduccionMenu(nodoSeleccionado, 'EN')">EN</button>
      <button class="btn-lang" [disabled]="!nodoSeleccionado" (click)="nodoSeleccionado && crearTraduccionMenu(nodoSeleccionado, 'CA')">CA</button>
      <button class="btn-lang" [disabled]="!nodoSeleccionado" (click)="nodoSeleccionado && crearTraduccionMenu(nodoSeleccionado, 'VA')">VA</button>
      <button class="btn-lang" [disabled]="!nodoSeleccionado" (click)="nodoSeleccionado && crearTraduccionMenu(nodoSeleccionado, 'GL')">GL</button>
    </div>
  </div>
</div>
