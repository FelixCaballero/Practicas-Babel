<div>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
    <h3 style="margin: 0;">Consulta Páginas</h3>
    <div style="display: flex; gap: 15px; align-items: center;">
      <!-- Selector de Idioma -->
      <div>
        <label style="font-weight: 600; margin-right: 5px;">Idioma:</label>
        <select [(ngModel)]="idiomaSeleccionado" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer;">
          <option value="1">EN</option>
          <option value="2">CA</option>
          <option value="3">VA</option>
          <option value="4">GL</option>
        </select>
      </div>
      
      <input type="text" [(ngModel)]="filtroDescripcion" placeholder="Filtrar por descripción..."
        style="padding: 8px; border-radius: 4px; border: 1px solid #ccc; width: 250px;">
    </div>
  </div>

  <table class="custom-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Título</th>
        <th>Descripción</th>
        <th>Migas de pan</th>
        <th>Idioma</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of listaPaginasFiltrada" (click)="paginaSeleccionada = p"
        [class.selected]="paginaSeleccionada === p" style="cursor: pointer;">
        <td>{{p.idPagina}}</td>
        <td>{{p.titulo}}</td>
        <td>{{p.descripcion}}</td>
        <td>{{p.migasPan}}</td>
        <td>{{p.idLang}}</td>
      </tr>
    </tbody>
  </table>

  <!-- Acciones flotantes abajo a la izquierda -->
  <div class="table-actions-floating">
    <span *ngIf="paginaSeleccionada" style="font-size: 0.9rem; color: #333;">Seleccionada: <strong>{{
        paginaSeleccionada.titulo }}</strong></span>
    <div>
      <button class="btn-edit" style="margin-right: 10px;" [disabled]="!paginaSeleccionada"
        (click)="paginaSeleccionada && editarPagina(paginaSeleccionada)">Modificar</button>
      <button class="btn-delete" style="margin-right: 10px;" [disabled]="!paginaSeleccionada"
        (click)="paginaSeleccionada && borrarPagina(paginaSeleccionada.idPagina)">Eliminar</button>

      <span *ngIf="paginaSeleccionada"
        style="font-size: 0.9rem; color: #555; margin-left:10px; margin-right:5px;">Traducir: </span>
      <button class="btn-lang" [disabled]="!paginaSeleccionada"
        (click)="paginaSeleccionada && crearTraduccionPagina(paginaSeleccionada, 'EN')">EN</button>
      <button class="btn-lang" [disabled]="!paginaSeleccionada"
        (click)="paginaSeleccionada && crearTraduccionPagina(paginaSeleccionada, 'CA')">CA</button>
      <button class="btn-lang" [disabled]="!paginaSeleccionada"
        (click)="paginaSeleccionada && crearTraduccionPagina(paginaSeleccionada, 'VA')">VA</button>
      <button class="btn-lang" [disabled]="!paginaSeleccionada"
        (click)="paginaSeleccionada && crearTraduccionPagina(paginaSeleccionada, 'GL')">GL</button>
    </div>
  </div>
</div>
