<div style="padding: 20px;">
  <h1>Lista de Usuarios - Babel Prácticas</h1>
  <table border="1" style="width: 100%; border-collapse: collapse;">
    <thead>
    <tr style="background-color: #f2f2f2;">
      <th>ID</th>
      <th>Nombre</th>
      <th>Email</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let p of listaPersonas">
      <td>{{ p.id }}</td>
      <td>{{ p.nombre }}</td>
      <td>{{ p.email }}</td>
    </tr>
    </tbody>
  </table>
</div>
