<div class="card form-card shadow-sm border-0 mb-4">
  <div class="card-body p-4">
    <div class="row g-3 align-items-end">
      <div class="col-12 col-md-9">
        <label for="filtro" class="form-label">ID o descripción</label>
        <input
          id="filtro"
          type="text"
          class="form-control form-control-lg"
          [(ngModel)]="filtro"
          name="filtro"
          placeholder="Introduce ID o descripción de la página"
        >
      </div>
      <div class="col-12 col-md-3 d-grid">
        <button type="button" class="btn btn-primary btn-lg" (click)="find()">
          Buscar
        </button>
      </div>
    </div>
  </div>
</div>

<div class="card form-card shadow-sm border-0">
  <div class="card-body p-4">
    <div class="table-responsive">
      @if (resultado) {
        <table class="table table-dark table-striped align-middle mb-0">
          <thead>
          <tr>
            <th>ID</th>
            <th>Idioma</th>
            <th>Título</th>
            <th>Descripción</th>
            <th>Migas de pan</th>
            <th>Contenido</th>
            <th class="text-center">Acciones</th>
          </tr>
          </thead>
          <tbody>
          <tr>
            <td>{{ resultado.id }}</td>
            <td>{{ resultado.idLang }}</td>
            <td>{{ resultado.titulo }}</td>
            <td>{{ resultado.descripcion }}</td>
            <td>{{ resultado.migasPan }}</td>
            <td>{{ resultado.pagina }}</td>
            <td class="text-center">
              <div class="d-flex justify-content-center gap-2">
                <button
                  class="btn btn-warning btn-sm"
                  (click)="update()">
                  Modificar
                </button>
                <button
                  class="btn btn-danger btn-sm"
                  (click)="delete()">
                  Eliminar
                </button>
              </div>
            </td>
          </tr>
          </tbody>
        </table>
      } @else {
        <div class="text-center text-secondary py-5">
          Introduce un ID o una descripción para buscar
        </div>
      }
    </div>
  </div>
</div>
