<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="card">
        <div class="card-header">
          <h4>Alta de Página</h4>
          <p class="subtitulo">Completa la información de la nueva página del portal</p>
        </div>

        <div class="card-body">
          <form (ngSubmit)="onSubmit()" #paginaFormRef="ngForm">
            <div class="row g-4">
              <div class="col-md-6">
                <label class="form-label">Idioma</label>
                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="pagina.idLang"
                  name="idLang"
                  placeholder="E"
                  required>
              </div>

              <div class="col-md-6">
                <label class="form-label">Título</label>
                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="pagina.titulo"
                  name="titulo"
                  placeholder="Ej: Portal del Paciente"
                  required>
              </div>

              <div class="col-12">
                <label class="form-label">Descripción</label>
                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="pagina.descripcion"
                  name="descripcion"
                  placeholder="Descripción interna de la página"
                  required>
              </div>

              <div class="col-12">
                <label class="form-label">Migas de pan</label>
                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="pagina.migasPan"
                  name="migasPan"
                  placeholder="Ej: Inicio / Portal"
                  required>
              </div>

              <div class="col-12">
                <label class="form-label">Contenido de la página</label>
                <textarea
                  class="form-control"
                  [(ngModel)]="pagina.pagina"
                  name="contenido"
                  rows="10"
                  placeholder="Escribe aquí el contenido HTML o texto de la página"
                  required></textarea>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-3 mt-4">
              <a routerLink="/layout/consultar-pagina" class="btn btn-outline-secondary">
                Cancelar
              </a>

              <button type="submit" class="btn btn-success">
                Crear página
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
